[package]
name = "flow-agent-core"
description = "Core building blocks for flow-agent: Runnable, chaining, messages, prompts, parsers, tools, config, events and errors."
readme = "README.md"
documentation = "https://docs.rs/flow-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Typed tool arguments with an auto-generated JSON Schema (`Tool::typed`).
schemars = ["dep:schemars"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
schemars.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
