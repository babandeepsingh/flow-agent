[package]
name = "flow-agent-checkpoint"
description = "Checkpointers for flow-agent graphs: in-memory, SQLite and Postgres. Enables resume, human-in-the-loop and replay."
readme = "README.md"
documentation = "https://docs.rs/flow-agent-checkpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## SQLite checkpointer (bundled SQLite via sqlx).
sqlite = ["sqlx/sqlite", "sqlx/runtime-tokio"]
## Postgres checkpointer (sqlx, rustls).
postgres = ["sqlx/postgres", "sqlx/runtime-tokio", "sqlx/tls-rustls-ring-webpki"]

[dependencies]
flow-agent-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
flow-agent-graph.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
