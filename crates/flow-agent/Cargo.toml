[package]
name = "flow-agent"
description = "LangChain/LangGraph-style LLM chains, tool-using agents and stateful, resumable graphs for Rust. JSON in, JSON out, async on tokio."
readme = "../../README.md"
documentation = "https://docs.rs/flow-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["anthropic", "openai"]
## Claude models (`"anthropic:..."`).
anthropic = ["flow-agent-models/anthropic"]
## OpenAI and OpenAI-compatible servers (`"openai:..."`).
openai = ["flow-agent-models/openai"]
## SQLite checkpointer.
sqlite = ["flow-agent-checkpoint/sqlite"]
## Postgres checkpointer.
postgres = ["flow-agent-checkpoint/postgres"]
## Typed tool arguments via `schemars`.
schemars = ["flow-agent-core/schemars"]
## Everything.
full = ["anthropic", "openai", "sqlite", "postgres", "schemars"]

[dependencies]
flow-agent-core.workspace = true
flow-agent-models.workspace = true
flow-agent-graph.workspace = true
flow-agent-checkpoint.workspace = true
flow-agent-prebuilt.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
