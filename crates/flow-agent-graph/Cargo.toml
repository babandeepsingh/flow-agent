[package]
name = "flow-agent-graph"
description = "LangGraph-style stateful graphs for flow-agent: StateGraph, reducers, parallel supersteps, streaming, interrupts and resume."
readme = "README.md"
documentation = "https://docs.rs/flow-agent-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
flow-agent-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
flow-agent-models.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tokio-util.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
