[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/babandeepsingh/flow-agent"
homepage = "https://github.com/babandeepsingh/flow-agent"
authors = ["Babandeep Singh"]
keywords = ["llm", "agent", "langchain", "langgraph", "ai"]
categories = ["asynchronous", "api-bindings", "development-tools"]

[workspace.dependencies]
flow-agent-core = { path = "crates/flow-agent-core", version = "0.1.0" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
