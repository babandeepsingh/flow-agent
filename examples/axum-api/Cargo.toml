[package]
name = "axum-api"
description = "Example: flow-agent behind an Axum HTTP API with SSE streaming and SQLite checkpoints."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
flow-agent = { workspace = true, features = ["anthropic", "openai", "sqlite"] }
axum.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
