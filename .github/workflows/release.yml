# Publishes all crates to crates.io.
#
# - Push a tag `vX.Y.Z` matching `version` in the root Cargo.toml to release.
# - Or run it by hand from the Actions tab (dry run by default).
#
# Auth today: the CARGO_REGISTRY_TOKEN repository secret.
# To switch to crates.io Trusted Publishing later:
#   1. Configure trusted publishing for each crate on crates.io (repo + this workflow file).
#   2. Uncomment `id-token: write` below and the "Authenticate" step.
#   3. In "Publish", use `${{ steps.auth.outputs.token }}` instead of the secret.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only package and verify, don't upload"
        type: boolean
        default: true

permissions:
  contents: read
  # id-token: write   # Trusted Publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # - name: Authenticate
      #   id: auth
      #   uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish.sh
